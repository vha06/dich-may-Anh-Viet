# Cấu hình siêu tham số cho mô hình Seq2Seq LSTM + Bahdanau Attention

model:
  vocab_size: 8000
  embed_dim: 256
  hidden_dim: 512
  attention_dim: 256
  num_layers: 2
  dropout: 0.3

training:
  batch_size: 64
  num_epochs: 20
  learning_rate: 0.001
  grad_clip: 1.0
  teacher_forcing_ratio: 0.5
  label_smoothing: 0.1
  scheduler: plateau
  scheduler_patience: 3
  scheduler_factor: 0.5
  min_lr: 0.000001

data:
  tokenizer_model: data/tokenizer/bpe.model
  train_en: data/processed/train.en
  train_vi: data/processed/train.vi
  val_en: data/processed/tst2012.en
  val_vi: data/processed/tst2012.vi
  test_en: data/processed/tst2013.en
  test_vi: data/processed/tst2013.vi
  max_len: 100

checkpoint:
  dir: checkpoints
  save_best: true
